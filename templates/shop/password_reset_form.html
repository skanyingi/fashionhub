{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FashionHub</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="hero-section">
        <p>FashionHub</p> 
        <a href="{% url 'index' %}" class="btn-hero">Back to Home</a>
    </div>
    <div class="container">
        <div class="auth-card" x-data="{ submitted: false, email: '', loading: false }">
            <h2>Reset Password</h2>
            <p>Enter your email address below and we'll send you a link to reset your password.</p>
            
            <form method="post" novalidate @submit="if($el.checkValidity()) { loading = true; } submitted = true; if(!$el.checkValidity()) { $event.preventDefault(); return false; }">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_email">Email Address:</label>
                    <input type="email" name="email" id="id_email" x-model="email" required placeholder="your@email.com"
                           :style="submitted && !email ? 'border-color: #c62828; background: #fff8f8;' : ''">
                    <span x-show="submitted && !email" style="color: #c62828; font-size: 12px; margin-top: 5px; display: block; font-weight: 600;">
                        <i class="fa fa-exclamation-circle"></i> Please enter your email address
                    </span>
                </div>

                <button type="submit" class="submit-btn" :disabled="loading" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <span x-show="!loading">Send Reset Link</span>
                    <span x-show="loading"><i class="fa fa-spinner fa-spin"></i> Sending...</span>
                </button>
            </form>
            
            <div class="auth-links">
                <a href="{% url 'login' %}"><i class="fa fa-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
